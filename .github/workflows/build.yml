name: build

on:
  push:
  pull_request:

jobs:
  firmware:
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        preset: [debug, release]
    steps:
      - uses: actions/checkout@v4

      - uses: carlosperate/arm-none-eabi-gcc-action@v1
        with:
          release: '13.3.Rel1'

      - run: sudo apt-get install -y ninja-build clang-format

      - name: Format
        run: clang-format --dry-run --Werror src/*.c src/*.h config/*.h

      - run: cmake --workflow --preset ${{ matrix.preset }}

      - uses: actions/upload-artifact@v4
        with:
          name: logolith-${{ matrix.preset }}
          path: |
            build/${{ matrix.preset }}/logolith.elf
            build/${{ matrix.preset }}/logolith.bin
            build/${{ matrix.preset }}/logolith.hex
